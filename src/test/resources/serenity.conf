serenity {
    project.name = "AUTO_FRONT_POM_FACTORY"
    take.screenshots = FOR_FAILURES
    test.root = "com.automatizacion"
}

webdriver {
    driver = chrome
    autodriver = true
    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
            args = [
                "test-type",
                "no-sandbox",
                "ignore-certificate-errors",
                "incognito",
                "disable-infobars",
                "disable-gpu",
                "disable-default-apps",
                "disable-popup-blocking",
                "disable-dev-shm-usage",
                "disable-extensions",
                "headless" # Recomendado para ejecuciones en Linux/CI
            ]
            binary = "/usr/bin/chromium"
        }
    }
}

environments {
    default {
        webdriver.base.url = "http://localhost:80"
    }
}