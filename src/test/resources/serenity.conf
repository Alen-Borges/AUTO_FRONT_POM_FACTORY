webdriver {
  driver = chrome
  autodriver = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "test-type", "no-sandbox", "ignore-certificate-errors", "--window-size=1000,800",
        "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking", "disable-notifications"]
    }
  }
}

serenity {
  project.name = "AUTO_FRONT_POM_FACTORY"
  take.screenshots = FOR_FAILURES
}

environments {
  default {
    webdriver.base.url = "http://localhost:80"
  }
  local {
    webdriver.base.url = "http://localhost:80"
  }
}
